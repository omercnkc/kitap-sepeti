spring:
  application:
    name: cart-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${CART_DB_HOST:localhost}:${CART_DB_PORT:3306}/cart_db
    username: ${CART_DB_USER}
    password: ${CART_DB_PASSWORD}
    hikari:
      # DB kesintisinde istekler varsayılan 30 sn yerine ~5 sn'de hata döner.
      # Milisaniye: HikariDataSource alanı long olduğu için "5s" gibi Duration yazımı bağlanmaz.
      connection-timeout: 5000
      # Satır kilidi beklemesi MySQL varsayılanı 50 sn yerine 5 sn (sepet kilidi dahil tüm yazımlar); aşılırsa
      # PessimisticLockingFailureException. Hibernate MySQL'de sorgu başına kilit süresi uygulayamıyor.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Birden çok sepetin lazy satırları sepet başına değil, 50'lik gruplarla tek sorguda yüklenir.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Açık anahtar ilk doğrulamada çekilir ve önbelleğe alınır; açılışta istek atılmaz.
          jwk-set-uri: ${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cloud:
    # OpenFeign'in getirdiği Spring Cloud health göstergeleri (discoveryComposite); health yalnızca servisin kendi
    # bileşenlerine bakar.
    discovery:
      client:
        composite-indicator:
          enabled: false
        health-indicator:
          enabled: false
    openfeign:
      client:
        config:
          # CatalogClient (@FeignClient name). Retry yok (Spring Cloud varsayılanı Retryer.NEVER_RETRY);
          # en kötü durumda istek ~connect + read süresi bekler.
          catalog:
            connect-timeout: 1000
            read-timeout: 2000
            # BASIC ve üstü URL'yi (kitap id'si), FULL header/gövdeyi loglar.
            logger-level: none

springdoc:
  # Testte bileşen taramasına giren deneme uçları (security/exception/client paketleri) dokümana girmez.
  packages-to-scan: com.kitapsepeti.cart.controller
  paths-to-match: /api/**, /internal/**
  default-produces-media-type: application/json
  # docs/api/cart-service.openapi.json diff'leri sıralama gürültüsü içermesin.
  writer-with-order-by-keys: true
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method

app:
  # Maven resource filtering ile pom'daki sürüm yazılır (OpenAPI info.version).
  version: "@project.version@"
  jwt:
    issuer: kitapsepeti-user-service
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8082}
  # Catalog çağrılarının circuit breaker'ı (config.CatalogCircuitBreakerConfig). Son 20 çağrının en az 10'u varken
  # hata oranı %50'ye ulaşınca açılır; açıkken istek gönderilmez, 10 sn sonra 3 deneme çağrısı.
  circuit-breaker:
    sliding-window-size: 20
    minimum-calls: 10
    failure-rate-threshold: 50
    open-duration: 10s
    half-open-calls: 3
  # /internal/** istemcileri. Ham anahtar burada değil; yalnızca SHA-256 özeti (64 hex). Catalog'dan farklı olarak
  # özet boşsa uygulama açılmaz (InternalAuthConfig).
  internal-auth:
    clients:
      - name: order-service
        key-sha256: ${CART_INTERNAL_KEY_ORDER_SHA256:}
  cart:
    # DB'deki ck_cart_items_quantity (1–99) bunun üst sınırıdır.
    max-quantity-per-item: 10
    max-lines: 50

logging:
  level:
    # SQL hata mesajı kullanıcı verisi içerebilir; WARN satırları kapatılır.
    org.hibernate.orm.jdbc.error: ERROR

server:
  port: 8083
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
      # /actuator link listesi de kapalı; dışarıya yalnızca health açılır.
      discovery:
        enabled: false
  health:
    # Spring Cloud'un refreshScope göstergesi (OpenFeign ile gelir).
    refresh:
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # catalog-service ve user-service (JWKS) bilinçli olarak yok: Catalog kapalıyken sepet okunabilir olmalı,
        # JWKS kesintisi ayrı bir 503 (AUTHENTICATION_UNAVAILABLE) olarak görünür.
        readiness:
          include: readinessState, db
