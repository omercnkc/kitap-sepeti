# Yalnızca test anahtar çifti; testler .env'deki gerçek anahtarlara bağımlı olmamalı.
app:
  jwt:
    private-key-location: classpath:jwt/test-private.pem
    public-key-location: classpath:jwt/test-public.pem
  # Worker arka planda outbox satırlarını kilitleyip yayınlamasın; yalnızca OutboxRelayIT açar.
  outbox:
    enabled: false
