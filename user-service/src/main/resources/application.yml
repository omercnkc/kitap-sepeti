spring:
  application:
    name: user-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${USER_DB_HOST:localhost}:${USER_DB_PORT:3306}/user_db
    username: ${USER_DB_USER}
    password: ${USER_DB_PASSWORD}
    hikari:
      # DB kesintisinde istekler ve readiness varsayılan 30 sn yerine ~5 sn'de hata döner.
      # Milisaniye: HikariDataSource alanı long olduğu için "5s" gibi Duration yazımı bağlanmaz.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # Broker kapalıyken outbox turu amqp-client'ın 60 sn'lik varsayılanında asılı kalmasın.
    connection-timeout: 5s
    # Her mesaj için broker onayı (ack/nack) CorrelationData future'ı ile beklenir.
    publisher-confirm-type: correlated

logging:
  level:
    # SQL hata mesajı kullanıcı verisi içerebilir (örn. Duplicate entry '<email>'); WARN satırları kapatılır.
    org.hibernate.orm.jdbc.error: ERROR
    # INFO "Created new connection ... amqp://<kullanıcı>@host" RabbitMQ kullanıcı adını yazar.
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: WARN

server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
      # /actuator link listesi de kapalı; dışarıya yalnızca health açılır.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # RabbitMQ bilinçli olarak yok: broker kapalıyken de istek alınır, olaylar outbox'ta bekler.
        readiness:
          include: readinessState, db

springdoc:
  # /test/** gibi yalnızca testte var olan uçlar dokümana girmez.
  paths-to-match: /api/**, /.well-known/**
  # Uçlarda produces yazılmadığı için başarı yanıtları aksi halde */* görünür.
  default-produces-media-type: application/json
  # docs/api/user-service.openapi.json diff'leri sıralama gürültüsü içermesin.
  writer-with-order-by-keys: true
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method

app:
  # Maven resource filtering ile pom'daki sürüm yazılır (OpenAPI info.version).
  version: "@project.version@"
  jwt:
    issuer: kitapsepeti-user-service
    access-ttl: 15m
    refresh-ttl: 14d
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  outbox:
    enabled: true
    exchange: kitapsepeti.events
    poll-interval: 2s
    batch-size: 50
    confirm-timeout: 5s
