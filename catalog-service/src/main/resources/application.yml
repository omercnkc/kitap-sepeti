spring:
  application:
    name: catalog-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:3306}/catalog_db
    username: ${CATALOG_DB_USER}
    password: ${CATALOG_DB_PASSWORD}
    hikari:
      # DB kesintisinde istekler varsayılan 30 sn yerine ~5 sn'de hata döner.
      # Milisaniye: HikariDataSource alanı long olduğu için "5s" gibi Duration yazımı bağlanmaz.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Lazy koleksiyonlar (ör. listedeki kitapların yazarları) kitap başına değil, 50'lik gruplarla tek sorguda yüklenir.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    # local profilinde uygulanan dev seed (repeatable) bu profilde bulunmaz; doğrulama onun yüzünden düşmesin.
    # Versioned migration'lar için eksik/değişmiş kontrolü aynen geçerli.
    ignore-migration-patterns: "*:future,repeatable:missing"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # Broker kapalıyken outbox turu amqp-client'ın 60 sn'lik varsayılanında asılı kalmasın.
    connection-timeout: 5s
    # Her mesaj için broker onayı (ack/nack) CorrelationData future'ı ile beklenir.
    publisher-confirm-type: correlated
  security:
    oauth2:
      resourceserver:
        jwt:
          # Açık anahtar ilk doğrulamada çekilir ve önbelleğe alınır; açılışta istek atılmaz.
          jwk-set-uri: ${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

app:
  jwt:
    issuer: kitapsepeti-user-service
  # Exchange user-service ile ortaktır; ad değişirse iki serviste birlikte değişmeli.
  outbox:
    enabled: true
    exchange: kitapsepeti.events
    poll-interval: 2s
    batch-size: 50
    confirm-timeout: 5s

logging:
  level:
    # SQL hata mesajı kullanıcı verisi içerebilir; WARN satırları kapatılır.
    org.hibernate.orm.jdbc.error: ERROR

server:
  port: 8082
  error:
    include-stacktrace: never
    include-message: never
