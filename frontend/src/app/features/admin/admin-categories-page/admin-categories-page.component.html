<section class="admin-categories">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <h2 class="h4 mb-0">Kategoriler</h2>
    <button
      type="button"
      class="btn btn-primary btn-sm"
      *ngIf="pageState === 'ready' || pageState === 'empty'"
      (click)="openCreate()"
    >
      Kategori ekle
    </button>
  </div>

  <app-spinner *ngIf="pageState === 'loading'" label="Kategoriler yükleniyor…"></app-spinner>

  <app-empty-state
    *ngIf="pageState === 'empty'"
    title="Henüz kategori yok"
    message="İlk kategoriyi ekleyerek ağacı oluşturmaya başlayın."
  ></app-empty-state>

  <div *ngIf="pageState === 'empty'" class="text-center mb-3">
    <button type="button" class="btn btn-primary btn-sm" (click)="openCreate()">
      Kategori ekle
    </button>
  </div>

  <app-empty-state
    *ngIf="pageState === 'error'"
    title="Kategoriler yüklenemedi"
    message="Liste alınamadı. Lütfen biraz sonra tekrar deneyin."
  ></app-empty-state>

  <ng-container *ngIf="pageState === 'ready'">
    <ng-template #nodeTpl let-nodes let-level="level" let-parentName="parentName">
      <ul class="list-unstyled admin-categories__list mb-0">
        <li
          *ngFor="let node of nodes; let last = last; trackBy: trackById"
          class="admin-categories__item"
        >
          <div
            class="admin-categories__row d-flex flex-wrap align-items-center gap-2 py-2"
            [style.padding-left.rem]="level * 1.5"
          >
            <div class="admin-categories__meta min-w-0 flex-grow-1">
              <div class="d-flex flex-wrap align-items-center gap-2">
                <span
                  *ngIf="level > 0"
                  class="admin-categories__branch"
                  aria-hidden="true"
                >{{ last ? '└' : '├' }}</span>
                <span
                  class="admin-categories__name"
                  [class.admin-categories__name--root]="level === 0"
                  [class.admin-categories__name--child]="level > 0"
                >{{ node.name }}</span>
                <span *ngIf="level === 0" class="badge bg-light text-muted border">
                  Ana kategori
                </span>
                <span *ngIf="level > 0" class="badge bg-secondary">Alt kategori</span>
              </div>
              <div class="font-monospace small text-muted">{{ node.slug }}</div>
              <div *ngIf="level > 0 && parentName" class="small text-muted">
                Üst: {{ parentName }}
              </div>
            </div>
            <div
              class="admin-categories__actions d-flex flex-wrap gap-1 ms-auto flex-shrink-0"
            >
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary"
                (click)="openCreate(node.id)"
                [disabled]="busyId === node.id"
              >
                Alt kategori
              </button>
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary"
                (click)="openEdit(node)"
                [disabled]="busyId === node.id"
              >
                Düzenle
              </button>
              <button
                type="button"
                class="btn btn-sm btn-outline-danger"
                (click)="onDelete(node)"
                [disabled]="busyId === node.id"
              >
                Sil
              </button>
            </div>
          </div>
          <ng-container *ngIf="node.children.length">
            <ng-container
              *ngTemplateOutlet="
                nodeTpl;
                context: {
                  $implicit: node.children,
                  level: level + 1,
                  parentName: node.name
                }
              "
            ></ng-container>
          </ng-container>
        </li>
      </ul>
    </ng-template>

    <div class="admin-categories__tree">
      <ng-container
        *ngTemplateOutlet="
          nodeTpl;
          context: { $implicit: tree, level: 0, parentName: null }
        "
      ></ng-container>
    </div>
  </ng-container>
</section>

<ng-template #entityModal>
  <div class="modal-header">
    <h3 class="modal-title h5 mb-0">
      {{ editing ? 'Kategoriyi düzenle' : 'Kategori ekle' }}
    </h3>
    <button
      type="button"
      class="btn-close"
      aria-label="Kapat"
      (click)="onFormCancel()"
      [disabled]="saving"
    ></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="onFormSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="category-name">Ad</label>
        <input
          id="category-name"
          type="text"
          class="form-control"
          formControlName="name"
          autocomplete="off"
          [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
        />
        <app-field-error [errors]="fieldErrors" field="name"></app-field-error>
      </div>

      <div class="mb-3">
        <label class="form-label" for="category-slug">Kısa ad (slug)</label>
        <input
          id="category-slug"
          type="text"
          class="form-control"
          formControlName="slug"
          autocomplete="off"
          placeholder="Boş bırakılırsa addan üretilir"
        />
        <app-field-error [errors]="fieldErrors" field="slug"></app-field-error>
      </div>

      <div class="mb-3">
        <label class="form-label" for="category-parent">Üst kategori</label>
        <select id="category-parent" class="form-select" formControlName="parentId">
          <option value="">(Kök)</option>
          <option *ngFor="let opt of parentOptions" [value]="opt.id">{{ opt.label }}</option>
        </select>
        <div class="form-text">
          Düzenlerken üst kategoriyi değiştirmek kategoriyi taşır.
        </div>
        <app-field-error [errors]="fieldErrors" field="parentId"></app-field-error>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="onFormCancel()"
          [disabled]="saving"
        >
          Vazgeç
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="!canSave">
          <span
            *ngIf="saving"
            class="spinner-border spinner-border-sm me-1"
            role="status"
          ></span>
          {{ editing ? 'Güncelle' : 'Ekle' }}
        </button>
      </div>
    </form>
  </div>
</ng-template>
