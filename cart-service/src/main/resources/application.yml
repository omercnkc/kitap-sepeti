spring:
  application:
    name: cart-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${CART_DB_HOST:localhost}:${CART_DB_PORT:3306}/cart_db
    username: ${CART_DB_USER}
    password: ${CART_DB_PASSWORD}
    hikari:
      # DB kesintisinde istekler varsayılan 30 sn yerine ~5 sn'de hata döner.
      # Milisaniye: HikariDataSource alanı long olduğu için "5s" gibi Duration yazımı bağlanmaz.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cart:
    # DB'deki ck_cart_items_quantity (1–99) bunun üst sınırıdır.
    max-quantity-per-item: 10
    max-lines: 50

logging:
  level:
    # SQL hata mesajı kullanıcı verisi içerebilir; WARN satırları kapatılır.
    org.hibernate.orm.jdbc.error: ERROR

server:
  port: 8083
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
      # /actuator link listesi de kapalı; dışarıya yalnızca health açılır.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # catalog-service bilinçli olarak yok: Catalog kapalıyken sepet okunabilir olmalı.
        readiness:
          include: readinessState, db
