<header class="app-header">
  <nav class="navbar navbar-expand-lg navbar-light container py-2">
    <a class="navbar-brand mb-0 flex-shrink-0" routerLink="/books" aria-label="Kitap Sepeti">
      <img
        class="app-header__logo"
        src="assets/brand/logo.png"
        alt="Kitap Sepeti"
        width="186"
        height="56"
      />
    </a>

    <button
      type="button"
      class="navbar-toggler d-lg-none"
      aria-label="Menüyü aç"
      (click)="openMenu(mobileMenu)"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse d-none d-lg-flex">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item">
          <a
            class="nav-link header-nav-btn"
            routerLink="/books"
            routerLinkActive="active"
          >
            <i class="bi bi-book" aria-hidden="true"></i>
            <span>{{ booksNavLabel(currentUser$ | async) }}</span>
          </a>
        </li>
        <li class="nav-item" *ngIf="showCart$ | async">
          <a
            class="nav-link header-nav-btn header-nav-btn--cart"
            routerLink="/cart"
            routerLinkActive="active"
          >
            <i class="bi bi-cart3" aria-hidden="true"></i>
            <span>Sepet</span>
            <span
              *ngIf="(cartCount$ | async) as count"
              class="badge rounded-pill header-nav-btn__badge"
              [class.d-none]="count < 1"
            >
              {{ count }}
            </span>
          </a>
        </li>

        <ng-container *ngIf="currentUser$ | async as user; else guestLinks">
          <li class="nav-item">
            <a
              class="nav-link header-nav-btn"
              routerLink="/account/profile"
              routerLinkActive="active"
            >
              <i class="bi bi-person-circle" aria-hidden="true"></i>
              <span>Profil</span>
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link header-nav-btn"
              routerLink="/account/addresses"
              routerLinkActive="active"
            >
              <i class="bi bi-geo-alt" aria-hidden="true"></i>
              <span>Adreslerim</span>
            </a>
          </li>
          <li class="nav-item" *ngIf="!isAdmin(user)">
            <a
              class="nav-link header-nav-btn"
              routerLink="/orders"
              routerLinkActive="active"
            >
              <i class="bi bi-bag-check" aria-hidden="true"></i>
              <span>Siparişler</span>
            </a>
          </li>
          <li class="nav-item" *ngIf="isAdmin(user)">
            <a
              class="nav-link header-nav-btn"
              routerLink="/admin"
              routerLinkActive="active"
            >
              <i class="bi bi-shield-lock" aria-hidden="true"></i>
              <span>Admin</span>
            </a>
          </li>
          <li class="nav-item">
            <span class="nav-link header-nav-btn header-nav-btn--label">{{
              displayName(user)
            }}</span>
          </li>
          <li class="nav-item">
            <button
              type="button"
              class="nav-link header-nav-btn"
              (click)="logout()"
            >
              <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
              <span>Çıkış</span>
            </button>
          </li>
        </ng-container>
        <ng-template #guestLinks>
          <li class="nav-item">
            <a
              class="nav-link header-nav-btn"
              routerLink="/login"
              routerLinkActive="active"
            >
              <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
              <span>Giriş</span>
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link header-nav-btn"
              routerLink="/register"
              routerLinkActive="active"
            >
              <i class="bi bi-person-plus" aria-hidden="true"></i>
              <span>Kayıt</span>
            </a>
          </li>
        </ng-template>
      </ul>
    </div>
  </nav>
</header>

<ng-template #mobileMenu let-offcanvas>
  <div class="offcanvas-header border-bottom">
    <a
      class="offcanvas-title app-header__brand-link mb-0"
      routerLink="/books"
      aria-label="Kitap Sepeti"
      (click)="offcanvas.dismiss()"
    >
      <img
        class="app-header__logo app-header__logo--menu"
        src="assets/brand/logo.png"
        alt="Kitap Sepeti"
        width="186"
        height="56"
      />
    </a>
    <button
      type="button"
      class="btn-close"
      aria-label="Kapat"
      (click)="offcanvas.dismiss()"
    ></button>
  </div>
  <div class="offcanvas-body">
    <nav class="nav flex-column gap-2 app-header__mobile-nav">
      <a
        class="nav-link header-nav-btn"
        routerLink="/books"
        routerLinkActive="active"
        (click)="offcanvas.dismiss()"
      >
        <i class="bi bi-book" aria-hidden="true"></i>
        <span>{{ booksNavLabel(currentUser$ | async) }}</span>
      </a>
      <a
        *ngIf="showCart$ | async"
        class="nav-link header-nav-btn header-nav-btn--cart"
        routerLink="/cart"
        routerLinkActive="active"
        (click)="offcanvas.dismiss()"
      >
        <i class="bi bi-cart3" aria-hidden="true"></i>
        <span>Sepet</span>
        <span
          *ngIf="(cartCount$ | async) as count"
          class="badge rounded-pill header-nav-btn__badge"
          [class.d-none]="count < 1"
        >
          {{ count }}
        </span>
      </a>

      <ng-container *ngIf="currentUser$ | async as user; else mobileGuest">
        <a
          class="nav-link header-nav-btn"
          routerLink="/account/profile"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          <i class="bi bi-person-circle" aria-hidden="true"></i>
          <span>Profil</span>
        </a>
        <a
          class="nav-link header-nav-btn"
          routerLink="/account/addresses"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          <i class="bi bi-geo-alt" aria-hidden="true"></i>
          <span>Adreslerim</span>
        </a>
        <a
          *ngIf="!isAdmin(user)"
          class="nav-link header-nav-btn"
          routerLink="/orders"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          <i class="bi bi-bag-check" aria-hidden="true"></i>
          <span>Siparişler</span>
        </a>
        <a
          *ngIf="isAdmin(user)"
          class="nav-link header-nav-btn"
          routerLink="/admin"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          <i class="bi bi-shield-lock" aria-hidden="true"></i>
          <span>Admin</span>
        </a>
        <span class="nav-link header-nav-btn header-nav-btn--label">{{
          displayName(user)
        }}</span>
        <button
          type="button"
          class="nav-link header-nav-btn text-start"
          (click)="logout(); offcanvas.dismiss()"
        >
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span>Çıkış</span>
        </button>
      </ng-container>
      <ng-template #mobileGuest>
        <a
          class="nav-link header-nav-btn"
          routerLink="/login"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
          <span>Giriş</span>
        </a>
        <a
          class="nav-link header-nav-btn"
          routerLink="/register"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          <i class="bi bi-person-plus" aria-hidden="true"></i>
          <span>Kayıt</span>
        </a>
      </ng-template>
    </nav>
  </div>
</ng-template>
