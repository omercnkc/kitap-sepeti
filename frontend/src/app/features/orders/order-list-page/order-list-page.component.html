<section class="container py-4 order-list">
  <h1 class="h4 mb-3">Siparişlerim</h1>

  <app-spinner *ngIf="pageState === 'loading'" label="Siparişler yükleniyor…"></app-spinner>

  <app-empty-state
    *ngIf="pageState === 'empty'"
    title="Henüz sipariş yok"
    message="Alışverişe başladığınızda siparişleriniz burada listelenir."
    ctaLabel="Kitaplara git"
    ctaLink="/books"
  ></app-empty-state>

  <app-empty-state
    *ngIf="pageState === 'error'"
    title="Siparişler yüklenemedi"
    message="Liste alınamadı. Lütfen biraz sonra tekrar deneyin."
    ctaLabel="Kitaplara git"
    ctaLink="/books"
  ></app-empty-state>

  <ng-container *ngIf="pageState === 'ready'">
    <!-- lg+: tablo -->
    <div class="table-responsive d-none d-lg-block">
      <table class="table table-hover align-middle order-list__table mb-0">
        <thead>
          <tr>
            <th scope="col">Sipariş</th>
            <th scope="col">Tarih</th>
            <th scope="col">Durum</th>
            <th scope="col" class="text-end">Kalem</th>
            <th scope="col" class="text-end">Toplam</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let order of orders; trackBy: trackById"
            class="order-list__row"
            role="link"
            tabindex="0"
            (click)="openOrder(order)"
            (keydown.enter)="openOrder(order)"
          >
            <td class="font-monospace small text-break">{{ order.id }}</td>
            <td class="text-nowrap">
              {{ order.createdAt | date: 'short' : undefined : 'tr-TR' }}
            </td>
            <td>
              <span class="badge" [ngClass]="statusBadgeClass(order.status)">
                {{ order.status | orderStatus }}
              </span>
            </td>
            <td class="text-end">{{ order.itemCount }}</td>
            <td class="text-end text-nowrap fw-semibold">
              {{
                order.totalAmount
                  | currency: (order.currency || 'TRY') : 'symbol' : '1.2-2' : 'tr-TR'
              }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- dar: kart -->
    <ul class="list-unstyled d-lg-none mb-0">
      <li *ngFor="let order of orders; trackBy: trackById" class="mb-3">
        <button
          type="button"
          class="order-list__card border rounded p-3 w-100 text-start bg-white"
          (click)="openOrder(order)"
        >
          <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
            <span class="badge" [ngClass]="statusBadgeClass(order.status)">
              {{ order.status | orderStatus }}
            </span>
            <span class="small text-muted text-nowrap">
              {{ order.createdAt | date: 'short' : undefined : 'tr-TR' }}
            </span>
          </div>
          <div class="font-monospace small text-break mb-2">{{ order.id }}</div>
          <div class="d-flex justify-content-between small">
            <span class="text-muted">{{ order.itemCount }} kalem</span>
            <span class="fw-semibold">
              {{
                order.totalAmount
                  | currency: (order.currency || 'TRY') : 'symbol' : '1.2-2' : 'tr-TR'
              }}
            </span>
          </div>
        </button>
      </li>
    </ul>

    <div class="mt-3">
      <app-pagination
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [totalElements]="totalElements"
        [totalPages]="totalPages"
        (pageIndexChange)="onPageIndexChange($event)"
      ></app-pagination>
    </div>
  </ng-container>
</section>
