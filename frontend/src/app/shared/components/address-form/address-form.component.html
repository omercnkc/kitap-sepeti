<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="address-form">
  <div class="mb-3">
    <label class="form-label" for="address-label">Etiket <span class="text-muted">(opsiyonel)</span></label>
    <input
      id="address-label"
      type="text"
      class="form-control"
      formControlName="label"
      maxlength="40"
      autocomplete="organization"
    />
    <app-field-error [errors]="fieldErrors" field="label"></app-field-error>
  </div>

  <div class="mb-3">
    <label class="form-label" for="address-recipientName">Alıcı adı soyadı</label>
    <input
      id="address-recipientName"
      type="text"
      class="form-control"
      formControlName="recipientName"
      maxlength="120"
      autocomplete="name"
      [class.is-invalid]="form.get('recipientName')!.touched && form.get('recipientName')!.invalid"
    />
    <div
      *ngIf="form.get('recipientName')!.touched && form.get('recipientName')!.hasError('required')"
      class="invalid-feedback d-block"
    >
      Alıcı adı gerekli.
    </div>
    <app-field-error [errors]="fieldErrors" field="recipientName"></app-field-error>
  </div>

  <div class="mb-3">
    <label class="form-label" for="address-phone">Telefon</label>
    <input
      id="address-phone"
      type="tel"
      class="form-control"
      formControlName="phone"
      appTrPhoneInput
      maxlength="16"
      inputmode="tel"
      autocomplete="tel"
      placeholder="05xx xxx xx xx"
      [class.is-invalid]="form.get('phone')!.touched && form.get('phone')!.invalid"
    />
    <div
      *ngIf="form.get('phone')!.touched && form.get('phone')!.hasError('required')"
      class="invalid-feedback d-block"
    >
      Telefon gerekli.
    </div>
    <div
      *ngIf="form.get('phone')!.touched && form.get('phone')!.hasError('trPhone')"
      class="invalid-feedback d-block"
    >
      Geçerli bir cep telefonu girin (05xx xxx xx xx).
    </div>
    <app-field-error [errors]="fieldErrors" field="phone"></app-field-error>
  </div>

  <div *ngIf="geoMismatchMessage" class="alert alert-warning py-2 small" role="status">
    {{ geoMismatchMessage }}
    <button
      *ngIf="freeTextMode"
      type="button"
      class="btn btn-link btn-sm p-0 align-baseline ms-1"
      (click)="useSelectMode()"
    >
      Listeden seç
    </button>
  </div>

  <ng-container *ngIf="!freeTextMode; else freeTextGeo">
    <div class="row g-3">
      <div class="col-md-4 mb-3">
        <label class="form-label" for="address-sehirId">İl</label>
        <select
          id="address-sehirId"
          class="form-select"
          formControlName="sehirId"
          [attr.disabled]="illerLoading ? true : null"
          [class.is-invalid]="form.get('sehirId')!.touched && form.get('sehirId')!.invalid"
        >
          <option value="">{{ illerLoading ? 'Yükleniyor…' : 'İl seçin' }}</option>
          <option *ngFor="let il of iller" [value]="il.sehir_id">{{ il.sehir_adi }}</option>
        </select>
        <div
          *ngIf="form.get('sehirId')!.touched && form.get('sehirId')!.hasError('required')"
          class="invalid-feedback d-block"
        >
          İl seçin.
        </div>
        <app-field-error [errors]="fieldErrors" field="city"></app-field-error>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label" for="address-ilceId">İlçe</label>
        <select
          id="address-ilceId"
          class="form-select"
          formControlName="ilceId"
          [attr.disabled]="!form.get('sehirId')!.value || ilcelerLoading ? true : null"
          [class.is-invalid]="form.get('ilceId')!.touched && form.get('ilceId')!.invalid"
        >
          <option value="">
            {{ ilcelerLoading ? 'Yükleniyor…' : 'İlçe seçin' }}
          </option>
          <option *ngFor="let ilce of ilceler" [value]="ilce.ilce_id">{{ ilce.ilce_adi }}</option>
        </select>
        <div
          *ngIf="form.get('ilceId')!.touched && form.get('ilceId')!.hasError('required')"
          class="invalid-feedback d-block"
        >
          İlçe seçin.
        </div>
        <app-field-error [errors]="fieldErrors" field="district"></app-field-error>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label" for="address-mahalleId">Mahalle</label>
        <select
          id="address-mahalleId"
          class="form-select"
          formControlName="mahalleId"
          [attr.disabled]="!form.get('ilceId')!.value || mahallelerLoading ? true : null"
          [class.is-invalid]="form.get('mahalleId')!.touched && form.get('mahalleId')!.invalid"
        >
          <option value="">
            {{ mahallelerLoading ? 'Yükleniyor…' : 'Mahalle seçin' }}
          </option>
          <option *ngFor="let m of mahalleler" [value]="m.mahalle_id">{{ m.mahalle_adi }}</option>
        </select>
        <div
          *ngIf="form.get('mahalleId')!.touched && form.get('mahalleId')!.hasError('required')"
          class="invalid-feedback d-block"
        >
          Mahalle seçin.
        </div>
        <app-field-error [errors]="fieldErrors" field="line1"></app-field-error>
      </div>
    </div>
  </ng-container>

  <ng-template #freeTextGeo>
    <div class="mb-3">
      <label class="form-label" for="address-line1">Adres satırı 1 (mahalle)</label>
      <input
        id="address-line1"
        type="text"
        class="form-control"
        formControlName="line1"
        maxlength="200"
        autocomplete="address-line1"
        [class.is-invalid]="form.get('line1')!.touched && form.get('line1')!.invalid"
      />
      <div
        *ngIf="form.get('line1')!.touched && form.get('line1')!.hasError('required')"
        class="invalid-feedback d-block"
      >
        Adres satırı gerekli.
      </div>
      <app-field-error [errors]="fieldErrors" field="line1"></app-field-error>
    </div>

    <div class="row g-3">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="address-district">İlçe <span class="text-muted">(opsiyonel)</span></label>
        <input
          id="address-district"
          type="text"
          class="form-control"
          formControlName="district"
          maxlength="80"
          autocomplete="address-level2"
        />
        <app-field-error [errors]="fieldErrors" field="district"></app-field-error>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="address-city">İl</label>
        <input
          id="address-city"
          type="text"
          class="form-control"
          formControlName="city"
          maxlength="80"
          autocomplete="address-level1"
          [class.is-invalid]="form.get('city')!.touched && form.get('city')!.invalid"
        />
        <div
          *ngIf="form.get('city')!.touched && form.get('city')!.hasError('required')"
          class="invalid-feedback d-block"
        >
          İl gerekli.
        </div>
        <app-field-error [errors]="fieldErrors" field="city"></app-field-error>
      </div>
    </div>
  </ng-template>

  <div class="mb-3">
    <label class="form-label" for="address-line2"
      >Cadde / sokak / bina <span class="text-muted">(opsiyonel)</span></label
    >
    <input
      id="address-line2"
      type="text"
      class="form-control"
      formControlName="line2"
      maxlength="200"
      autocomplete="address-line2"
      placeholder="Cadde, sokak, kapı no, daire"
    />
    <app-field-error [errors]="fieldErrors" field="line2"></app-field-error>
  </div>

  <div class="row g-3">
    <div class="col-md-6 mb-3">
      <label class="form-label" for="address-postalCode">Posta kodu <span class="text-muted">(opsiyonel)</span></label>
      <input
        id="address-postalCode"
        type="text"
        class="form-control"
        formControlName="postalCode"
        maxlength="16"
        autocomplete="postal-code"
      />
      <app-field-error [errors]="fieldErrors" field="postalCode"></app-field-error>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label" for="address-country">Ülke</label>
      <input
        id="address-country"
        type="text"
        class="form-control"
        formControlName="country"
        maxlength="2"
        autocomplete="country"
        [class.is-invalid]="form.get('country')!.touched && form.get('country')!.invalid"
      />
      <div
        *ngIf="form.get('country')!.touched && form.get('country')!.invalid"
        class="invalid-feedback d-block"
      >
        Ülke kodu 2 büyük harf olmalı (ör. TR).
      </div>
      <app-field-error [errors]="fieldErrors" field="country"></app-field-error>
    </div>
  </div>

  <div class="form-check mb-3">
    <input
      id="address-isDefault"
      type="checkbox"
      class="form-check-input"
      formControlName="isDefault"
    />
    <label class="form-check-label" for="address-isDefault">Varsayılan adres</label>
  </div>

  <div class="d-flex flex-wrap gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="!canSave">
      {{ submitting ? 'Kaydediliyor…' : 'Kaydet' }}
    </button>
    <button
      *ngIf="showCancel"
      type="button"
      class="btn btn-outline-secondary"
      [disabled]="submitting"
      (click)="onCancel()"
    >
      Vazgeç
    </button>
  </div>
</form>
