services:
  mysql:
    image: mysql:8.4
    container_name: kitapsepeti-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user_db
      MYSQL_USER: ${USER_DB_USER}
      MYSQL_PASSWORD: ${USER_DB_PASSWORD}
      # infra/mysql/init/10-catalog-db.sh okur (catalog_db şeması + kullanıcısı).
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Yalnızca boş volume'da otomatik çalışır; mevcut volume'da script elle çalıştırılır.
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: kitapsepeti-rabbitmq
    # RabbitMQ verisini node adına (rabbit@<hostname>) göre saklar; sabit hostname olmadan
    # container yeniden oluşturulunca volume'daki exchange/kuyruk/mesajlar görünmez olur.
    hostname: kitapsepeti-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: kitapsepeti/user-service:local
    container_name: kitapsepeti-user-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - jwt_private_key
      - jwt_public_key
    # .env toplu verilmez (env_file yok); yalnızca gereken değişkenler. .env'deki JWT_* yolları
    # yerel (Windows) çalıştırma içindir; container anahtarları secret dosyalarından okur.
    environment:
      USER_DB_HOST: mysql
      USER_DB_PORT: "3306"
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public_key
    # Readiness yalnızca DB'ye bakar; RabbitMQ kapalıyken servis healthy kalır (olaylar outbox'ta bekler).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "-o", "/dev/null", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 768m

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    image: kitapsepeti/catalog-service:local
    container_name: kitapsepeti-catalog-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    # user-service'e bağımlılık yok: JWKS ilk admin isteğinde çekilir; user-service kapalıyken public uçlar 200,
    # admin uçları 503 AUTHENTICATION_UNAVAILABLE döner.
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # .env toplu verilmez (env_file yok); yalnızca gereken değişkenler. Profil verilmez: local profilindeki
    # dev seed container'da uygulanmaz (volume'daki seed geçmişi ignore-migration-patterns ile yok sayılır).
    environment:
      CATALOG_DB_HOST: mysql
      CATALOG_DB_PORT: "3306"
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      USER_SERVICE_JWKS_URI: http://user-service:8081/.well-known/jwks.json
      CATALOG_INTERNAL_KEY_ORDER_SHA256: ${CATALOG_INTERNAL_KEY_ORDER_SHA256}
    # Readiness yalnızca DB'ye bakar; RabbitMQ veya user-service kapalıyken servis healthy kalır.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "-o", "/dev/null", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 768m

  # Opsiyonel geliştirme aracı (yalnızca bakmak için): docker compose --profile tools up -d adminer
  adminer:
    image: adminer:latest
    container_name: kitapsepeti-adminer
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

secrets:
  jwt_private_key:
    file: ./secrets/jwt/private.pem
  jwt_public_key:
    file: ./secrets/jwt/public.pem

volumes:
  mysql_data:
  rabbitmq_data:
