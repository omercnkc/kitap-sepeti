<section class="admin-entity-page">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <h2 class="h4 mb-0">Yayınevleri</h2>
    <button
      type="button"
      class="btn btn-primary btn-sm"
      *ngIf="pageState === 'ready' || pageState === 'empty'"
      (click)="openCreate()"
    >
      Yayınevi ekle
    </button>
  </div>

  <app-spinner *ngIf="pageState === 'loading'" label="Yayınevleri yükleniyor…"></app-spinner>

  <app-empty-state
    *ngIf="pageState === 'empty'"
    title="Henüz yayınevi yok"
    message="İlk yayınevini ekleyerek kataloğu oluşturmaya başlayın."
  ></app-empty-state>

  <div *ngIf="pageState === 'empty'" class="text-center mt-n2 mb-3">
    <button type="button" class="btn btn-primary btn-sm" (click)="openCreate()">
      Yayınevi ekle
    </button>
  </div>

  <app-empty-state
    *ngIf="pageState === 'error'"
    title="Yayınevleri yüklenemedi"
    message="Liste alınamadı. Lütfen biraz sonra tekrar deneyin."
  ></app-empty-state>

  <ng-container *ngIf="pageState === 'ready'">
    <div class="d-none d-lg-block">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th scope="col">Ad</th>
            <th scope="col">Slug</th>
            <th scope="col" class="text-end">İşlem</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items; trackBy: trackById">
            <td class="fw-semibold">{{ item.name }}</td>
            <td class="font-monospace small">{{ item.slug }}</td>
            <td class="text-end text-nowrap">
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary me-1"
                (click)="openEdit(item)"
                [disabled]="busyId === item.id"
              >
                Düzenle
              </button>
              <button
                type="button"
                class="btn btn-sm btn-outline-danger"
                (click)="onDelete(item)"
                [disabled]="busyId === item.id"
              >
                Sil
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ul class="list-unstyled d-lg-none mb-0">
      <li *ngFor="let item of items; trackBy: trackById" class="border rounded p-3 mb-2">
        <div class="fw-semibold mb-1">{{ item.name }}</div>
        <div class="font-monospace small text-muted mb-2">{{ item.slug }}</div>
        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="openEdit(item)"
            [disabled]="busyId === item.id"
          >
            Düzenle
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="onDelete(item)"
            [disabled]="busyId === item.id"
          >
            Sil
          </button>
        </div>
      </li>
    </ul>

    <app-pagination
      class="d-block mt-3"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [totalElements]="totalElements"
      [totalPages]="totalPages"
      (pageIndexChange)="onPageIndexChange($event)"
    ></app-pagination>
  </ng-container>
</section>

<ng-template #entityModal>
  <div class="modal-header">
    <h3 class="modal-title h5 mb-0">
      {{ editing ? 'Yayınevini düzenle' : 'Yayınevi ekle' }}
    </h3>
    <button
      type="button"
      class="btn-close"
      aria-label="Kapat"
      (click)="onFormCancel()"
      [disabled]="saving"
    ></button>
  </div>
  <div class="modal-body">
    <app-admin-name-slug-form
      [name]="editing?.name || ''"
      [slug]="editing?.slug || ''"
      [fieldErrors]="fieldErrors"
      [submitting]="saving"
      [submitLabel]="editing ? 'Güncelle' : 'Ekle'"
      (save)="onFormSave($event)"
      (cancel)="onFormCancel()"
    ></app-admin-name-slug-form>
  </div>
</ng-template>
