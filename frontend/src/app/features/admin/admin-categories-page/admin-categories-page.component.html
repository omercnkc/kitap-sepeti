<section class="admin-entity-page">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <h2 class="h4 mb-0">Kategoriler</h2>
    <button
      type="button"
      class="btn btn-primary btn-sm"
      *ngIf="pageState === 'ready' || pageState === 'empty'"
      (click)="openCreate()"
    >
      Kategori ekle
    </button>
  </div>

  <app-spinner *ngIf="pageState === 'loading'" label="Kategoriler yükleniyor…"></app-spinner>

  <app-empty-state
    *ngIf="pageState === 'empty'"
    title="Henüz kategori yok"
    message="İlk kategoriyi ekleyerek kataloğu oluşturmaya başlayın."
  ></app-empty-state>

  <div *ngIf="pageState === 'empty'" class="text-center mb-3">
    <button type="button" class="btn btn-primary btn-sm" (click)="openCreate()">
      Kategori ekle
    </button>
  </div>

  <app-empty-state
    *ngIf="pageState === 'error'"
    title="Kategoriler yüklenemedi"
    message="Liste alınamadı. Lütfen biraz sonra tekrar deneyin."
  ></app-empty-state>

  <ng-container *ngIf="pageState === 'ready'">
    <div class="d-none d-lg-block">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th scope="col">Ad</th>
            <th scope="col">Slug</th>
            <th scope="col" class="text-end">İşlem</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items; trackBy: trackById">
            <td class="fw-semibold">{{ item.name }}</td>
            <td class="font-monospace small">{{ item.slug }}</td>
            <td class="text-end text-nowrap">
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary me-1"
                (click)="openEdit(item)"
                [disabled]="busyId === item.id"
              >
                Düzenle
              </button>
              <button
                type="button"
                class="btn btn-sm btn-outline-danger"
                (click)="onDelete(item)"
                [disabled]="busyId === item.id"
              >
                Sil
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ul class="list-unstyled d-lg-none mb-0">
      <li *ngFor="let item of items; trackBy: trackById" class="border rounded p-3 mb-2">
        <div class="fw-semibold mb-1">{{ item.name }}</div>
        <div class="font-monospace small text-muted mb-2">{{ item.slug }}</div>
        <div class="d-flex flex-wrap gap-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="openEdit(item)"
            [disabled]="busyId === item.id"
          >
            Düzenle
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="onDelete(item)"
            [disabled]="busyId === item.id"
          >
            Sil
          </button>
        </div>
      </li>
    </ul>
  </ng-container>
</section>

<ng-template #entityModal>
  <div class="modal-header">
    <h3 class="modal-title h5 mb-0">
      {{ editing ? 'Kategoriyi düzenle' : 'Kategori ekle' }}
    </h3>
    <button
      type="button"
      class="btn-close"
      aria-label="Kapat"
      (click)="onFormCancel()"
      [disabled]="saving"
    ></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="onFormSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="category-name">Ad</label>
        <input
          id="category-name"
          type="text"
          class="form-control"
          formControlName="name"
          autocomplete="off"
          [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
        />
        <app-field-error [errors]="fieldErrors" field="name"></app-field-error>
      </div>

      <div class="mb-3">
        <label class="form-label" for="category-slug">Kısa ad (slug)</label>
        <input
          id="category-slug"
          type="text"
          class="form-control"
          formControlName="slug"
          autocomplete="off"
          placeholder="Boş bırakılırsa addan üretilir"
        />
        <app-field-error [errors]="fieldErrors" field="slug"></app-field-error>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="onFormCancel()"
          [disabled]="saving"
        >
          Vazgeç
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="!canSave">
          <span
            *ngIf="saving"
            class="spinner-border spinner-border-sm me-1"
            role="status"
          ></span>
          {{ editing ? 'Güncelle' : 'Ekle' }}
        </button>
      </div>
    </form>
  </div>
</ng-template>
