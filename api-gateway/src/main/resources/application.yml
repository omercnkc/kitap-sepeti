server:
  port: 8080

spring:
  application:
    name: api-gateway
  # Kapak multipart (~5 MB dosya); varsayilan codec limiti kucuk kalir.
  codec:
    max-in-memory-size: 6MB
  # Rate limit (Adim 2+). Compose: REDIS_HOST=redis; lokal spring-boot:run: localhost.
  # Lettuce lazy connect; Redis yokken context fail-fast acilmaz (FAIL-OPEN, Adim 0).
  # Kisa timeout: Redis DOWN iken istekler RedisRateLimiter onErrorResume ile allow olur.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:500ms}
  cloud:
    gateway:
      server:
        webflux:
          # throw-on-limit: 429'u HttpClientErrorException olarak firlat → Problem Details handler.
          filter:
            request-rate-limiter:
              deny-empty-key: false
              throw-on-limit: true
          # Daha spesifik route'lar (Method + dar Path) once; order dusuk = oncelik yuksek.
          routes: &gateway_routes
            - id: auth
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              order: 0
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${AUTH_RATE_REPLENISH:1}
                    redis-rate-limiter.burstCapacity: ${AUTH_RATE_BURST:10}
                    redis-rate-limiter.requestedTokens: 1

            - id: user-me
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              order: 0
              predicates:
                - Path=/api/me,/api/me/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${DEFAULT_RATE_REPLENISH:2}
                    redis-rate-limiter.burstCapacity: ${DEFAULT_RATE_BURST:100}
                    redis-rate-limiter.requestedTokens: 1

            - id: catalog-public
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              order: 0
              predicates:
                - Method=GET
                - Path=/api/books,/api/books/**,/api/categories,/api/categories/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${CATALOG_READ_RATE_REPLENISH:2}
                    redis-rate-limiter.burstCapacity: ${CATALOG_READ_RATE_BURST:120}
                    redis-rate-limiter.requestedTokens: 1

            - id: catalog-write
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              order: 10
              predicates:
                - Method=POST,PUT,PATCH,DELETE
                - Path=/api/books,/api/books/**,/api/categories,/api/categories/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${DEFAULT_RATE_REPLENISH:2}
                    redis-rate-limiter.burstCapacity: ${DEFAULT_RATE_BURST:100}
                    redis-rate-limiter.requestedTokens: 1

            - id: catalog-admin
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              order: 10
              predicates:
                - Path=/api/admin,/api/admin/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${DEFAULT_RATE_REPLENISH:2}
                    redis-rate-limiter.burstCapacity: ${DEFAULT_RATE_BURST:100}
                    redis-rate-limiter.requestedTokens: 1

            - id: cart
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              order: 0
              predicates:
                - Path=/api/cart,/api/cart/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${CART_RATE_REPLENISH:1}
                    redis-rate-limiter.burstCapacity: ${CART_RATE_BURST:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: orders-checkout
              uri: ${ORDER_SERVICE_URL:http://localhost:8088}
              order: 0
              predicates:
                - Method=POST
                - Path=/api/orders/checkout
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${CHECKOUT_RATE_REPLENISH:1}
                    redis-rate-limiter.burstCapacity: ${CHECKOUT_RATE_BURST:5}
                    redis-rate-limiter.requestedTokens: 1

            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8088}
              order: 10
              predicates:
                - Path=/api/orders,/api/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${DEFAULT_RATE_REPLENISH:2}
                    redis-rate-limiter.burstCapacity: ${DEFAULT_RATE_BURST:100}
                    redis-rate-limiter.requestedTokens: 1

            # search/notification: ghost route; default tier (skip yok)
            - id: search
              uri: ${SEARCH_SERVICE_URL:http://localhost:8084}
              order: 0
              predicates:
                - Path=/api/search,/api/search/**,/api/suggest,/api/suggest/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${DEFAULT_RATE_REPLENISH:2}
                    redis-rate-limiter.burstCapacity: ${DEFAULT_RATE_BURST:100}
                    redis-rate-limiter.requestedTokens: 1

            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
              order: 0
              predicates:
                - Path=/api/notifications,/api/notifications/**,/api/preferences,/api/preferences/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${DEFAULT_RATE_REPLENISH:2}
                    redis-rate-limiter.burstCapacity: ${DEFAULT_RATE_BURST:100}
                    redis-rate-limiter.requestedTokens: 1

            - id: payment-webhook
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
              order: 0
              predicates:
                - Path=/webhooks/**,/api/webhooks/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${WEBHOOK_RATE_REPLENISH:1}
                    redis-rate-limiter.burstCapacity: ${WEBHOOK_RATE_BURST:60}
                    redis-rate-limiter.requestedTokens: 1
      routes: *gateway_routes

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Redis DOWN olsa bile /actuator/health UP kalsin (FAIL-OPEN; readiness'e baglama Adim 8 opsiyonel).
  health:
    redis:
      enabled: false

app:
  jwt:
    jwks-url: ${JWKS_URL:http://localhost:8081/.well-known/jwks.json}
    cache-ttl-seconds: ${JWT_CACHE_TTL_SECONDS:300}
    protected-paths:
      - /api/protected/**
  # Token-bucket dokumantasyonu (replenishRate = token/saniye). Filtreler env ile okur.
  # Env: AUTH_RATE_REPLENISH/BURST, CATALOG_READ_RATE_*, CART_RATE_*, CHECKOUT_RATE_*,
  # DEFAULT_RATE_*, WEBHOOK_RATE_*.
  # retry-after-seconds: 429 Retry-After (sabit; X-RateLimit-* kalan token'dan turetilmez).
  rate-limit:
    retry-after-seconds: ${RATE_LIMIT_RETRY_AFTER_SECONDS:60}
    auth:
      replenish-rate: ${AUTH_RATE_REPLENISH:1}
      burst-capacity: ${AUTH_RATE_BURST:10}
    catalog-read:
      replenish-rate: ${CATALOG_READ_RATE_REPLENISH:2}
      burst-capacity: ${CATALOG_READ_RATE_BURST:120}
    cart:
      replenish-rate: ${CART_RATE_REPLENISH:1}
      burst-capacity: ${CART_RATE_BURST:60}
    checkout:
      replenish-rate: ${CHECKOUT_RATE_REPLENISH:1}
      burst-capacity: ${CHECKOUT_RATE_BURST:5}
    default:
      replenish-rate: ${DEFAULT_RATE_REPLENISH:2}
      burst-capacity: ${DEFAULT_RATE_BURST:100}
    webhook:
      replenish-rate: ${WEBHOOK_RATE_REPLENISH:1}
      burst-capacity: ${WEBHOOK_RATE_BURST:60}
