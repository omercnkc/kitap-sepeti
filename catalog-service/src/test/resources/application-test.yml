# Bağlantı bilgisi @ServiceConnection ile Testcontainers'tan gelir; testler .env'deki CATALOG_DB_* ve
# RABBITMQ_* değerlerine bağımlı olmamalı (placeholder'lar burada sabit değerle karşılanır).
spring:
  datasource:
    username: test
    password: test
  rabbitmq:
    username: test
    password: test
  jpa:
    properties:
      hibernate:
        # Sorgu sayısı testleri için (Statistics.getPrepareStatementCount); yalnızca test profilinde.
        generate_statistics: true
        # Üretilen SQL'i doğrulayan testler için (ör. stok kolonlarının UPDATE'e girmemesi); kayıt varsayılan kapalı.
        session_factory:
          statement_inspector: com.kitapsepeti.catalog.support.SqlCapture

app:
  # Worker arka planda outbox satırlarını kilitleyip yayınlamasın; yalnızca relay testleri açar.
  outbox:
    enabled: false

logging:
  level:
    # generate_statistics her session sonunda INFO "Session Metrics" yazar; gürültü kapatılır.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
