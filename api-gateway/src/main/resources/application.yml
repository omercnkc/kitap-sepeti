server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes: &gateway_routes
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**, /api/me/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/books/**, /api/categories/**, /api/admin/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/orders/**
            - id: search-service
              uri: ${SEARCH_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/search/**, /api/suggest/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/notifications/**, /api/preferences/**
            - id: payment-webhook
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/webhooks/**, /api/webhooks/**
      routes: *gateway_routes

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    jwks-url: ${JWKS_URL:http://localhost:8081/.well-known/jwks.json}
    cache-ttl-seconds: ${JWT_CACHE_TTL_SECONDS:300}
    protected-paths:
      - /api/protected/**
