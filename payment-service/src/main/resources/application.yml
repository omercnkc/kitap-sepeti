spring:
  application:
    name: payment-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:3306}/payment_db
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      # DB kesintisinde istekler varsayılan 30 sn yerine ~5 sn'de hata döner.
      # Milisaniye: HikariDataSource alanı long olduğu için "5s" gibi Duration yazımı bağlanmaz.
      connection-timeout: 5000
      # Satır kilidi beklemesi MySQL varsayılanı 50 sn yerine 5 sn; aşılırsa PessimisticLockingFailureException.
      # Hibernate MySQL'de sorgu başına kilit süresi uygulayamıyor.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # Broker kapalıyken outbox turu amqp-client'ın 60 sn'lik varsayılanında asılı kalmasın.
    connection-timeout: 5s
    # Her mesaj için broker onayı (ack/nack) CorrelationData future'ı ile beklenir.
    publisher-confirm-type: correlated

app:
  # Exchange user-service ve catalog-service ile ortaktır; ad değişirse tüm servislerde birlikte değişmeli.
  outbox:
    enabled: true
    exchange: kitapsepeti.events
    poll-interval: 2s
    batch-size: 50
    confirm-timeout: 5s
  # /internal/** istemcileri. Ham anahtar burada değil; yalnızca SHA-256 özeti (64 hex). Özet yok/boş/bozuksa
  # uygulama açılmaz (InternalAuthConfig).
  internal-auth:
    clients:
      - name: order-service
        key-sha256: ${PAYMENT_INTERNAL_KEY_ORDER_SHA256:}
  payment:
    # v1'de yalnızca mock; başka değerle uygulama açılmaz (PaymentConfig).
    provider: mock
    mock:
      # Kuruşu bu değer olan tutarlar CARD_DECLINED ile failed (0–99).
      fail-cents: 99

logging:
  level:
    # SQL hata mesajı kullanıcı verisi içerebilir; WARN satırları kapatılır.
    org.hibernate.orm.jdbc.error: ERROR
    # INFO "Created new connection ... amqp://<kullanıcı>@host" RabbitMQ kullanıcı adını yazar.
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: WARN

server:
  port: 8087
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
      # /actuator link listesi de kapalı; dışarıya yalnızca health açılır.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # RabbitMQ bilinçli olarak yok (catalog ile aynı): broker kapalıyken de ödeme oluşturma çalışır,
        # olaylar outbox'ta bekler.
        readiness:
          include: readinessState, db
