# Bağlantı bilgisi @ServiceConnection ile Testcontainers'tan gelir; testler .env'deki ORDER_DB_* ve
# RABBITMQ_* değerlerine bağımlı olmamalı (placeholder'lar burada sabit değerle karşılanır).
spring:
  datasource:
    username: test
    password: test
  rabbitmq:
    username: test
    password: test
  jpa:
    properties:
      hibernate:
        session_factory:
          statement_inspector: com.kitapsepeti.order.support.SqlCapture


app:
  # Worker arka planda outbox satırlarını kilitleyip yayınlamasın.
  outbox:
    enabled: false
  # Listener yalnızca gerçek broker entegrasyon testlerinin ayrı bağlamında açılır.
  payment-results:
    enabled: false
  # Kurtarma görevi testler sırasında arka planda koşmasın.
  stock-sync:
    enabled: false
  pending-reconcile:
    enabled: false
  clients:
    # Sahte; .env'deki gerçek anahtar testlere girmez. Adresler ApiTestSupport'taki stub sunuculardan gelir.
    internal-api-key: order-test-internal-key-not-a-secret
