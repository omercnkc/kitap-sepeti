# Bağlantı bilgisi @ServiceConnection ile Testcontainers'tan gelir; testler .env'deki CART_DB_* değerlerine
# bağımlı olmamalı (placeholder'lar burada sabit değerle karşılanır).
spring:
  datasource:
    username: test
    password: test
  jpa:
    properties:
      hibernate:
        # Sorgu sayısı testleri için (Statistics.getPrepareStatementCount); yalnızca test profilinde.
        generate_statistics: true
        # Üretilen SQL'i doğrulayan testler için (ör. FOR UPDATE); kayıt varsayılan kapalı.
        session_factory:
          statement_inspector: com.kitapsepeti.cart.support.SqlCapture

logging:
  level:
    # generate_statistics her session sonunda INFO "Session Metrics" yazar; gürültü kapatılır.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
