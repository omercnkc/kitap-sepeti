<section class="container py-4" style="max-width: 28rem">
  <h1 class="h4 mb-3">Giriş</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-3">
      <label class="form-label" for="login-email">E-posta</label>
      <input
        id="login-email"
        type="email"
        class="form-control"
        formControlName="email"
        autocomplete="email"
        [class.is-invalid]="form.get('email')!.touched && form.get('email')!.invalid"
      />
      <div
        *ngIf="form.get('email')!.touched && form.get('email')!.hasError('required')"
        class="invalid-feedback d-block"
      >
        E-posta gerekli.
      </div>
      <div
        *ngIf="form.get('email')!.touched && form.get('email')!.hasError('email')"
        class="invalid-feedback d-block"
      >
        Geçerli bir e-posta girin.
      </div>
      <app-field-error [errors]="fieldErrors" field="email"></app-field-error>
    </div>

    <div class="mb-3">
      <label class="form-label" for="login-password">Parola</label>
      <input
        id="login-password"
        type="password"
        class="form-control"
        formControlName="password"
        autocomplete="current-password"
        [class.is-invalid]="form.get('password')!.touched && form.get('password')!.invalid"
      />
      <div
        *ngIf="form.get('password')!.touched && form.get('password')!.hasError('required')"
        class="invalid-feedback d-block"
      >
        Parola gerekli.
      </div>
      <app-field-error [errors]="fieldErrors" field="password"></app-field-error>
    </div>

    <div class="form-check mb-3">
      <input
        id="login-remember"
        type="checkbox"
        class="form-check-input"
        formControlName="rememberMe"
      />
      <label class="form-check-label" for="login-remember">Beni hatırla</label>
    </div>

    <div *ngIf="formError" class="alert alert-danger py-2" role="alert">
      {{ formError }}
    </div>

    <button
      type="submit"
      class="btn btn-primary w-100"
      [disabled]="submitting"
      [attr.aria-busy]="submitting"
    >
      {{ submitting ? 'Giriş yapılıyor…' : 'Giriş yap' }}
    </button>
  </form>

  <p class="mt-3 mb-0 small text-muted">
    Hesabın yok mu?
    <a routerLink="/register">Kayıt ol</a>
  </p>
</section>
