spring:
  application:
    name: user-service
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${USER_DB_HOST:localhost}:${USER_DB_PORT:3306}/user_db
    username: ${USER_DB_USER}
    password: ${USER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # Broker kapalıyken outbox turu amqp-client'ın 60 sn'lik varsayılanında asılı kalmasın.
    connection-timeout: 5s
    # Her mesaj için broker onayı (ack/nack) CorrelationData future'ı ile beklenir.
    publisher-confirm-type: correlated

logging:
  level:
    # SQL hata mesajı kullanıcı verisi içerebilir (örn. Duplicate entry '<email>'); WARN satırları kapatılır.
    org.hibernate.orm.jdbc.error: ERROR

server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    issuer: kitapsepeti-user-service
    access-ttl: 15m
    refresh-ttl: 14d
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  outbox:
    enabled: true
    exchange: kitapsepeti.events
    poll-interval: 2s
    batch-size: 50
    confirm-timeout: 5s
