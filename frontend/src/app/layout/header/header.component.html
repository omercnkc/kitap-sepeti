<header class="app-header border-bottom bg-white">
  <nav class="navbar navbar-expand-lg navbar-light container py-2">
    <a class="navbar-brand fw-semibold text-primary mb-0" routerLink="/books">
      Kitap Sepeti
    </a>

    <button
      type="button"
      class="navbar-toggler d-lg-none"
      aria-label="Menüyü aç"
      (click)="openMenu(mobileMenu)"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse d-none d-lg-flex">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item">
          <a class="nav-link" routerLink="/books" routerLinkActive="active">Kitaplar</a>
        </li>
        <li class="nav-item">
          <a class="nav-link position-relative" routerLink="/cart" routerLinkActive="active">
            Sepet
            <span
              *ngIf="(cartCount$ | async) as count"
              class="badge rounded-pill bg-primary ms-1"
              [class.d-none]="count < 1"
            >
              {{ count }}
            </span>
          </a>
        </li>

        <ng-container *ngIf="currentUser$ | async as user; else guestLinks">
          <li class="nav-item">
            <a class="nav-link" routerLink="/account/profile" routerLinkActive="active">Profil</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/account/addresses" routerLinkActive="active">Adreslerim</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/orders" routerLinkActive="active">Siparişler</a>
          </li>
          <li class="nav-item" *ngIf="isAdmin(user)">
            <a class="nav-link" routerLink="/admin" routerLinkActive="active">Admin</a>
          </li>
          <li class="nav-item">
            <span class="nav-link text-body pe-0">{{ displayName(user) }}</span>
          </li>
          <li class="nav-item">
            <button type="button" class="btn btn-link nav-link" (click)="logout()">
              Çıkış
            </button>
          </li>
        </ng-container>
        <ng-template #guestLinks>
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Giriş</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active">Kayıt</a>
          </li>
        </ng-template>
      </ul>
    </div>
  </nav>
</header>

<ng-template #mobileMenu let-offcanvas>
  <div class="offcanvas-header border-bottom">
    <h2 class="offcanvas-title h5 mb-0">Menü</h2>
    <button
      type="button"
      class="btn-close"
      aria-label="Kapat"
      (click)="offcanvas.dismiss()"
    ></button>
  </div>
  <div class="offcanvas-body">
    <nav class="nav flex-column gap-1">
      <a
        class="nav-link px-0"
        routerLink="/books"
        routerLinkActive="active"
        (click)="offcanvas.dismiss()"
      >
        Kitaplar
      </a>
      <a
        class="nav-link px-0"
        routerLink="/cart"
        routerLinkActive="active"
        (click)="offcanvas.dismiss()"
      >
        Sepet
        <span
          *ngIf="(cartCount$ | async) as count"
          class="badge rounded-pill bg-primary ms-1"
          [class.d-none]="count < 1"
        >
          {{ count }}
        </span>
      </a>

      <ng-container *ngIf="currentUser$ | async as user; else mobileGuest">
        <a
          class="nav-link px-0"
          routerLink="/account/profile"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          Profil
        </a>
        <a
          class="nav-link px-0"
          routerLink="/account/addresses"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          Adreslerim
        </a>
        <a
          class="nav-link px-0"
          routerLink="/orders"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          Siparişler
        </a>
        <a
          *ngIf="isAdmin(user)"
          class="nav-link px-0"
          routerLink="/admin"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          Admin
        </a>
        <span class="nav-link px-0 text-body">{{ displayName(user) }}</span>
        <button
          type="button"
          class="btn btn-link nav-link px-0 text-start"
          (click)="logout(); offcanvas.dismiss()"
        >
          Çıkış
        </button>
      </ng-container>
      <ng-template #mobileGuest>
        <a
          class="nav-link px-0"
          routerLink="/login"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          Giriş
        </a>
        <a
          class="nav-link px-0"
          routerLink="/register"
          routerLinkActive="active"
          (click)="offcanvas.dismiss()"
        >
          Kayıt
        </a>
      </ng-template>
    </nav>
  </div>
</ng-template>
